# Netlify config for proconnectnow.com. In the Netlify UI set Base directory to
# sites/proconnectnow. Pre-built static site — no build step.
[build]
  publish = "public"
  command = "echo 'static site — nothing to build'"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
